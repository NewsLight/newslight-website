<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest?v=13" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=13" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=13" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=13" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=14" />
    <title>NewsLight</title>

    <meta property="og:site_name" content="NewsLight" />
    <meta property="og:image" content="https://www.newslight.com/brand-logo.png" />
    <meta property="og:type" content="article" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              brand: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      .nl-hero-bento {
        box-shadow:
          0 20px 50px -18px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body class="min-h-screen bg-[linear-gradient(to_bottom,_#0a1628_0%,_#0b2038_22%,_#0f4a6b_48%,_#127090_66%,_#1c9cb8_82%,_#26b6d6_94%,_#29bddf_100%)] font-sans antialiased text-white">

    <!-- Nav (sticky) — matches index.html: hamburger + sheet on small screens -->
    <header class="sticky top-0 z-50 px-3 pt-2.5 sm:px-4 sm:pt-3 md:px-6 lg:px-8">
      <div
        id="nl-nav-backdrop"
        class="fixed inset-0 z-40 hidden bg-black/45 sm:hidden"
        aria-hidden="true"
      ></div>
      <nav
        class="relative z-50 mx-auto flex w-full max-w-[min(100%,1200px)] items-center justify-between gap-2 rounded-2xl border border-white/10 bg-[#0a1628]/75 px-3 py-2.5 shadow-[0_12px_40px_-12px_rgba(0,0,0,0.5)] backdrop-blur-xl sm:gap-3 sm:px-5 sm:py-3 md:px-6"
      >
        <a href="/" class="flex min-w-0 flex-1 items-center gap-2 transition-opacity hover:opacity-90 sm:flex-none sm:gap-3">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center p-1 sm:h-12 sm:w-12 md:h-14 md:w-14 md:p-1.5">
            <img src="/brand-logo.png?v=13" alt="NewsLight" fetchpriority="high" decoding="async" class="max-h-full max-w-full object-contain rounded-none" />
          </div>
          <span class="font-brand min-w-0 truncate text-lg tracking-tight sm:text-xl md:text-2xl lg:text-3xl"
            ><span class="font-bold">News</span><span class="font-light">Light</span></span
          >
        </a>
        <div class="hidden shrink-0 flex-wrap items-center justify-end gap-0.5 sm:flex sm:gap-1">
          <a
            href="/#top"
            class="rounded-full px-2.5 py-1.5 text-sm font-medium text-white/75 transition-colors hover:bg-white/10 hover:text-white sm:px-3 sm:py-2 sm:text-base md:px-4"
            >Home</a
          >
          <a
            href="/#features"
            class="rounded-full px-2.5 py-1.5 text-sm font-medium text-white/75 transition-colors hover:bg-white/10 hover:text-white sm:px-3 sm:py-2 sm:text-base md:px-4"
            >Features</a
          >
          <a
            href="/#download"
            class="rounded-full px-2.5 py-1.5 text-sm font-medium text-white/75 transition-colors hover:bg-white/10 hover:text-white sm:px-3 sm:py-2 sm:text-base md:px-4"
            >Download</a
          >
          <a
            href="/#contact"
            class="rounded-full px-2.5 py-1.5 text-sm font-medium text-white/75 transition-colors hover:bg-white/10 hover:text-white sm:px-3 sm:py-2 sm:text-base md:px-4"
            >Contact</a
          >
        </div>
        <button
          type="button"
          id="nl-nav-toggle"
          class="nl-hero-bento flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/[0.06] text-white/90 backdrop-blur-md transition hover:border-white/20 hover:bg-white/[0.1] sm:hidden"
          aria-expanded="false"
          aria-controls="nl-nav-menu"
          aria-label="Open menu"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div
          id="nl-nav-menu"
          class="absolute left-0 right-0 top-[calc(100%+0.5rem)] z-50 hidden flex-col rounded-2xl border border-white/10 bg-[#0a1628]/95 p-2 shadow-[0_16px_48px_-12px_rgba(0,0,0,0.55)] backdrop-blur-xl sm:hidden"
          role="navigation"
          aria-label="Sections"
        >
          <a
            href="/#top"
            class="rounded-xl px-4 py-3 text-base font-medium text-white/90 transition-colors hover:bg-white/10 hover:text-white"
            >Home</a
          >
          <a
            href="/#features"
            class="rounded-xl px-4 py-3 text-base font-medium text-white/90 transition-colors hover:bg-white/10 hover:text-white"
            >Features</a
          >
          <a
            href="/#download"
            class="rounded-xl px-4 py-3 text-base font-medium text-white/90 transition-colors hover:bg-white/10 hover:text-white"
            >Download</a
          >
          <a
            href="/#contact"
            class="rounded-xl px-4 py-3 text-base font-medium text-white/90 transition-colors hover:bg-white/10 hover:text-white"
            >Contact</a
          >
        </div>
      </nav>
    </header>

    <!-- Content rendered by JS -->
    <main id="content" class="max-w-2xl mx-auto px-4 sm:px-6 md:px-10 lg:px-14 xl:px-20 py-16"></main>

    <!-- Footer -->
    <footer class="max-w-5xl mx-auto px-4 sm:px-6 md:px-10 lg:px-14 xl:px-20 py-12 border-t border-white/15">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <p class="text-white/55 text-sm">&copy; 2026 NewsLight. All rights reserved.</p>
        <div class="flex gap-6">
          <a href="/terms" class="text-white/55 text-sm hover:text-white transition-colors">Terms</a>
          <a href="/privacy" class="text-white/55 text-sm hover:text-white transition-colors">Privacy</a>
          <a href="/#contact" class="text-white/55 text-sm hover:text-white transition-colors">Contact</a>
        </div>
      </div>
    </footer>

    <!-- Shared article links: /article/{uuid} → web preview + "Open in NewsLight" (newslight://) + App Store (404.html on static hosts). Do not remove this script. -->
    <script>
      (function () {
        var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        var path = window.location.pathname.replace(/\/+$/, '');
        var parts = path.split('/');
        // Match /article/{uuid}
        if (parts.length === 3 && parts[1] === 'article' && UUID_RE.test(parts[2])) {
          showArticlePage(parts[2]);
        } else {
          showNotFound();
        }

        function showNotFound() {
          document.title = 'Page Not Found — NewsLight';
          document.getElementById('content').innerHTML =
            '<div class="text-center py-20">' +
              '<h1 class="font-serif text-5xl font-bold mb-4">Page Not Found</h1>' +
              '<p class="text-white/80 text-lg mb-8">The page you\'re looking for doesn\'t exist.</p>' +
              '<a href="/" class="inline-block bg-white text-neutral-950 font-semibold text-sm px-8 py-4 rounded-full hover:bg-neutral-200 transition-colors">Back to Home</a>' +
            '</div>';
        }

        function showArticlePage(uuid) {
          var deepLink = 'newslight://app/news/' + uuid;
          var appStoreUrl = 'https://apps.apple.com/ca/app/newslight/id6758728521';
          var apiUrl = 'https://skykbtnscepbkerzcqlq.supabase.co/functions/v1/news/articles/' + uuid + '/preview';
          var apiKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNreWtidG5zY2VwYmtlcnpjcWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3OTE3ODYsImV4cCI6MjA4MjM2Nzc4Nn0.I9Uk1M_Hc3V5LPsbYmZMqDjkl1qfDvR7pqXcMtZqmpo';

          // Show loading state
          document.getElementById('content').innerHTML =
            '<div class="text-center py-20">' +
              '<div class="inline-block w-8 h-8 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>' +
              '<p class="text-white/80 mt-4">Loading article…</p>' +
            '</div>';

          // Deep link is triggered by the "Open in NewsLight" button, not auto-redirect

          // Fetch article preview
          fetch(apiUrl, {
            headers: { 'apikey': apiKey }
          })
            .then(function (res) {
              if (!res.ok) throw new Error('Not found');
              return res.json();
            })
            .then(function (json) {
              var article = (json.data && json.data.article) || json;
              var cityObj = (json.data && json.data.city) || {};
              var headline = article.headline || article.title || 'Untitled Article';
              var summary = article.summary || article.description || '';
              var city = cityObj.name || article.city_name || '';

              document.title = headline + ' — NewsLight';

              // Update OG tags dynamically (helps with some crawlers)
              setMeta('og:title', headline + ' — NewsLight');
              if (summary) setMeta('og:description', summary);
              setMeta('og:url', window.location.href);

              document.getElementById('content').innerHTML =
                '<article class="py-8">' +
                  (city ? '<p class="text-sm font-medium text-white/55 uppercase tracking-wider mb-4">' + escapeHtml(city) + '</p>' : '') +
                  '<h1 class="font-serif text-2xl md:text-3xl font-bold leading-tight mb-10 line-clamp-2">' + escapeHtml(headline.length > 60 ? headline.substring(0, 60) + '…' : headline) + '</h1>' +
                  '<div class="bg-black/20 backdrop-blur-sm border border-white/20 rounded-2xl p-8 text-center mb-12">' +
                    '<p class="text-white/80 mb-6">This article is available exclusively in the NewsLight app</p>' +
                    '<a href="' + deepLink + '" class="inline-block bg-white text-neutral-950 font-semibold px-8 py-4 rounded-full hover:bg-neutral-200 transition-colors mb-3">Open in NewsLight</a>' +
                  '</div>' +
                  '<div class="text-center">' +
                    '<h2 class="font-serif text-2xl font-bold mb-3">Get NewsLight</h2>' +
                    '<p class="text-white/80 mb-6">Available on the App Store for iPhone.</p>' +
                    '<a href="' + appStoreUrl + '" target="_blank" rel="noopener noreferrer" class="inline-block bg-black/25 border border-white/25 text-white font-semibold text-sm px-8 py-4 rounded-full hover:border-white/40 hover:bg-black/35 transition-colors">Download on the App Store</a>' +
                  '</div>' +
                '</article>';
            })
            .catch(function () {
              document.title = 'Article — NewsLight';
              document.getElementById('content').innerHTML =
                '<div class="py-8 text-center">' +
                  '<h1 class="font-serif text-3xl md:text-4xl font-bold mb-4">Read This Article in NewsLight</h1>' +
                  '<p class="text-white/80 text-lg mb-8">This article is available exclusively in the NewsLight app.</p>' +
                  '<div class="bg-black/20 backdrop-blur-sm border border-white/20 rounded-2xl p-8 mb-12">' +
                    '<a href="' + deepLink + '" class="inline-block bg-white text-neutral-950 font-semibold px-8 py-4 rounded-full hover:bg-neutral-200 transition-colors mb-3">Open in NewsLight</a>' +
                  '</div>' +
                  '<div>' +
                    '<h2 class="font-serif text-2xl font-bold mb-3">Get NewsLight</h2>' +
                    '<p class="text-white/80 mb-6">Available on the App Store for iPhone.</p>' +
                    '<a href="' + appStoreUrl + '" target="_blank" rel="noopener noreferrer" class="inline-block bg-black/25 border border-white/25 text-white font-semibold text-sm px-8 py-4 rounded-full hover:border-white/40 hover:bg-black/35 transition-colors">Download on the App Store</a>' +
                  '</div>' +
                '</div>';
            });
        }

        function escapeHtml(str) {
          var div = document.createElement('div');
          div.appendChild(document.createTextNode(str));
          return div.innerHTML;
        }

        function setMeta(property, content) {
          var el = document.querySelector('meta[property="' + property + '"]');
          if (el) {
            el.setAttribute('content', content);
          } else {
            el = document.createElement('meta');
            el.setAttribute('property', property);
            el.setAttribute('content', content);
            document.head.appendChild(el);
          }
        }
      })();
    </script>
    <script>
      (function () {
        var toggle = document.getElementById('nl-nav-toggle');
        var menu = document.getElementById('nl-nav-menu');
        var backdrop = document.getElementById('nl-nav-backdrop');
        if (!toggle || !menu) return;
        function setOpen(open) {
          if (open) {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
          } else {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
          }
          if (backdrop) backdrop.classList.toggle('hidden', !open);
          document.body.style.overflow = open ? 'hidden' : '';
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        }
        if (window.matchMedia) {
          var mqNav = window.matchMedia('(min-width: 640px)');
          mqNav.addEventListener('change', function () {
            if (mqNav.matches) setOpen(false);
          });
        }
        toggle.addEventListener('click', function () {
          setOpen(menu.classList.contains('hidden'));
        });
        if (backdrop) {
          backdrop.addEventListener('click', function () {
            setOpen(false);
          });
        }
        menu.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () {
            setOpen(false);
          });
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') setOpen(false);
        });
      })();
    </script>
  </body>
</html>
